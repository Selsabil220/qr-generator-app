name: CI/CD - democyber

# Trigger the workflow on push or pull request to main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/qr-generator-app:latest

    steps:
      # Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # <-- ADD THIS (Gitleaks needs full history)

    # --- NEW: GITLEAKS SCAN ---
      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Install Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Compile Java code
      - name: Compile Java
        run: mvn compile

      # Build Maven
      - name: Build Java project with Maven
        run: mvn clean package -DskipTests

      
      - name: SonarCloud scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.9.0.7382:sonar
          -Dsonar.projectKey="$SONAR_PROJECT_KEY"
          -Dsonar.organization="$SONAR_ORGANIZATION"
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.qualitygate.wait=true
      
      # --- ADD HADOLINT HERE ---
      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf
        with:
          dockerfile: Dockerfile
      # -------------------------

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build Docker image
      - name: Build Docker image
        run: docker build -t $DOCKER_IMAGE_NAME .

      # Test Docker image locally
      - name: Test Docker image locally
        run: |
          docker run -d --name qr-test -p 8080:8080 $DOCKER_IMAGE_NAME
          sleep 15
          curl -f http://localhost:8080 || (docker logs qr-test && exit 1)
          docker stop qr-test
          docker rm qr-test
            # --- TRIVY SCAN: Generate JSON Report ---
      - name: Trivy scan - generate JSON report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE_NAME }}
          format: 'json'
          output: 'trivy-report.json'
          exit-code: '0'          # 0 means it won't fail the pipeline, just generates the report
          severity: 'CRITICAL,HIGH'

      # --- TRIVY SCAN: Upload the Report ---
      - name: Upload Trivy report
        if: always()              # Always upload, even if previous step fails
        uses: actions/upload-artifact@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          name: trivy-report
          path: trivy-report.json

      # --- TRIVY SCAN: Security Gate (The strict one) ---
      - name: Trivy scan - fail on vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.DOCKER_IMAGE_NAME }}
          format: 'table'
          exit-code: '1'          # 1 means if HIGH/CRIT are found, the pipeline FAILS
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true    # Ignore CVEs that don't have a patch yet
          #trivyignores: '.trivyignore' # <--- ADD THIS LINE

      # --- PUSH TO DOCKER HUB ---
      - name: Push Docker image
        if: github.event_name == 'push'
        run: docker push $DOCKER_IMAGE_NAME
      