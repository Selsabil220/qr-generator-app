<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Secure QR App</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #1f2937;
            margin-bottom: 10px;
        }
        p {
            color: #6b7280;
            margin-bottom: 20px;
        }
        input {
            width: 90%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #2563eb;
        }
        #result {
            margin-top: 25px;
        }
        #qrImage {
            max-width: 100%;
            border-radius: 8px;
            display: none;
            border: 1px solid #e5e7eb;
        }
        /* --- NEW: Error Box Styling --- */
        #errorBox {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #ef4444;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>QR Code Generator</h1>
    <p>Enter a link below to generate your QR code</p>
    
    <input type="text" id="urlInput" placeholder="https://example.com">
    <button onclick="generateQR()">Generate QR Code</button>
    
    <div id="result">
        <img id="qrImage" alt="QR Code" style="display:none;">
        <!-- NEW: The error box div -->
        <div id="errorBox"></div>
    </div>
</div>


<script>
async function generateQR() {
    const url = document.getElementById('urlInput').value.trim();
    const img = document.getElementById('qrImage');
    const errorBox = document.getElementById('errorBox');

    // Reset previous results
    img.style.display = 'none';

    if (img.src.startsWith('blob:')) {
        URL.revokeObjectURL(img.src);
    }

    img.removeAttribute('src');
    errorBox.style.display = 'none';
    errorBox.innerText = '';

    if (!url) {
        errorBox.innerText = 'Please enter a URL first!';
        errorBox.style.display = 'block';
        return;
    }

    try {
        const response = await fetch(
            '/api/qr/generate?text=' + encodeURIComponent(url)
        );

        if (!response.ok) {
            const responseText = await response.text();

            let message = 'QR generation refused.';

            try {
                const errorData = JSON.parse(responseText);

                message =
                    errorData.detail ||
                    errorData.message ||
                    errorData.error ||
                    message;

            } catch {
                if (responseText.trim()) {
                    message = responseText;
                }
            }

            throw new Error(message);
        }

        const contentType = response.headers.get('content-type') || '';

        if (!contentType.includes('image/png')) {
            throw new Error('The server did not return a valid QR image.');
        }

        const blob = await response.blob();
        const imageUrl = URL.createObjectURL(blob);

        img.onload = () => URL.revokeObjectURL(imageUrl);

        img.onerror = () => {
            URL.revokeObjectURL(imageUrl);
            img.style.display = 'none';
            errorBox.innerText = 'Failed to display the QR code.';
            errorBox.style.display = 'block';
        };

        img.src = imageUrl;
        img.style.display = 'block';

    } catch (error) {
        img.style.display = 'none';
        errorBox.innerText = '⚠️ ' + error.message;
        errorBox.style.display = 'block';

        console.error('QR generation error:', error);
    }

}
</script>


</body>
</html>
