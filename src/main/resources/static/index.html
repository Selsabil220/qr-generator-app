<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Secure QR App</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #1f2937;
            margin-bottom: 10px;
        }
        p {
            color: #6b7280;
            margin-bottom: 20px;
        }
        input {
            width: 90%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #2563eb;
        }
        #result {
            margin-top: 25px;
        }
        #qrImage {
            max-width: 100%;
            border-radius: 8px;
            display: none;
            border: 1px solid #e5e7eb;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>QR Code Generator 🚀</h1>
    <p>Enter a link below to generate your QR code</p>
    
    <input type="text" id="urlInput" placeholder="https://example.com">
    <button onclick="generateQR()">Generate QR Code</button>
    
    <div id="result">
        <img id="qrImage" src="" alt="QR Code">
    </div>
</div>

<script>
    function generateQR() {
        const url = document.getElementById('urlInput').value;
        const img = document.getElementById('qrImage');
        
        if (url) {
            // This calls your Java backend!
            img.src = '/api/qr/generate?text=' + encodeURIComponent(url);
            img.style.display = 'block'; // Show the image
        } else {
            alert("Please enter a URL first!");
        }
    }
</script>

</body>
</html>
